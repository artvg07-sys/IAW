<VirtualHost 127.0.0.1:8080>
    ServerName tudominio2.local
    DocumentRoot /var/www/tu_marca_2/html
    ErrorLog ${APACHE_LOG_DIR}/error_marca2.log
    CustomLog ${APACHE_LOG_DIR}/access_marca2.log combined

    # Desactivar listado de directorios y proteger recurso sensible
    <Directory /var/www/tu_marca_2/html>
        Options -Indexes
    </Directory>

    <Location /config/datos-confidenciales.json>
        Require all denied
    </Location>
</VirtualHost>
